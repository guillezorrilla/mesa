<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa</title>
    <!-- The first frame, before the stylesheet and the profile's theme: style.css's background. -->
    <style>
      :root:not([data-theme]) {
        background-color: oklch(0.985 0.002 250);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          color-scheme: dark;
          background-color: oklch(0.105 0.005 250);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
