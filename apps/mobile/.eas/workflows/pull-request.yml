# On a pull request that touches the app: computes the native fingerprint on EAS and, when no
# production build has it, shows a check saying the merge will build for TestFlight rather than
# send an over-the-air update.
name: Pull request

on:
  pull_request:
    branches: ['main']
    paths:
      - apps/mobile/**
      - packages/core/src/phone/protocol/**
      - pnpm-lock.yaml

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production
  get_ios_build:
    name: Check for an existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
  native_change:
    name: Merging makes a new TestFlight build
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    steps:
      - run: echo "No production build has this native fingerprint (${{ needs.fingerprint.outputs.ios_fingerprint_hash }}), so merging builds and submits to TestFlight instead of sending an over-the-air update."
