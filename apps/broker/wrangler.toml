# Mesa's OAuth broker (ADR-0014), feedback relay (ADR-0025), install count (ADR-0026) and phone pairings.
# Secrets: wrangler secret put ATLASSIAN_CLIENT_ID, then ATLASSIAN_CLIENT_SECRET, and so on;
# FEEDBACK_GITHUB_TOKEN for feedback; APNS_KEY (the .p8 file's text), APNS_KEY_ID, APNS_TEAM_ID and
# APNS_TOPIC (the app's bundle id) for phone pushes.
name = "mesa-broker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Five feedback requests a minute from one IP address.
[[ratelimits]]
name = "FEEDBACK_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Ten install pings or erasures a minute from one IP address.
[[ratelimits]]
name = "INSTALLS_LIMIT"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Ten new pairings a minute from one IP address.
[[ratelimits]]
name = "PAIRING_LIMIT"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 10
  period = 60

# One Durable Object per phone pairing (ADR-0014's 2026-11-11 amendment), SQLite-backed.
[[durable_objects.bindings]]
name = "PAIRINGS"
class_name = "Pairing"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pairing"]

# Anonymous install counts (ADR-0026). Created with `wrangler d1 create mesa-installs`; the
# tables are migrations/, applied with `wrangler d1 migrations apply mesa-installs --remote`.
[[d1_databases]]
binding = "DB"
database_name = "mesa-installs"
database_id = "df55b0bc-37c0-4c9b-a4e0-4bee88c4f260"
