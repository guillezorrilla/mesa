# Says on a pull request when merging it changes the phone app's native fingerprint, so it will
# make a new TestFlight build instead of an over-the-air update (ADR-0027). Holds no Expo token.
name: mobile-pr

on:
  pull_request:
    paths:
      - apps/mobile/**
      - pnpm-lock.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The iOS native fingerprint at this pull request's head and at its base. expo-updates
      # computes it from what is installed, so nothing else is fetched.
      - id: head
        run: echo "hash=$(pnpm -C apps/mobile exec expo-updates fingerprint:generate --platform ios | jq -r .hash)" >> "$GITHUB_OUTPUT"
      - id: base
        run: |
          git checkout --quiet "${{ github.event.pull_request.base.sha }}"
          if [ -d apps/mobile ]; then
            pnpm install --frozen-lockfile
            echo "hash=$(pnpm -C apps/mobile exec expo-updates fingerprint:generate --platform ios | jq -r .hash)" >> "$GITHUB_OUTPUT"
          else
            echo "hash=none" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.hash != steps.base.outputs.hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --edit-last --create-if-none --body \
            "This pull request changes the phone app's native fingerprint (${{ steps.base.outputs.hash }} to ${{ steps.head.outputs.hash }}): merging it makes a new TestFlight build, not an over-the-air update."
