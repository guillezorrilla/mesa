# Says on a pull request when merging it changes the phone app's native fingerprint, so it will
# make a new TestFlight build instead of an over-the-air update (ADR-0027). Holds no Expo token.
name: mobile-pr

on:
  pull_request:
    paths:
      - apps/mobile/**
      - pnpm-lock.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: fingerprint
        uses: expo/expo-github-action/fingerprint@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          working-directory: apps/mobile
          packager: pnpm
      - if: steps.fingerprint.outputs.fingerprint-diff != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          DIFF: ${{ steps.fingerprint.outputs.fingerprint-diff }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body \
            "This pull request changes the phone app's native fingerprint ($(echo "$DIFF" | jq length) sources): merging it makes a new TestFlight build, not an over-the-air update."
