# Says on a pull request when merging it changes the phone app's native fingerprint, so mobile.yml
# will make a new TestFlight build instead of an over-the-air update (ADR-0027). Holds no Expo
# token and never fails the pull request.
name: mobile-pr

on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/core/src/phone/protocol/**
      - pnpm-lock.yaml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mobile-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The iOS native fingerprint at the head and at the base, computed as mobile.yml does.
      - id: head
        run: |
          pnpm install --frozen-lockfile
          echo "hash=$(pnpm -C apps/mobile exec expo-updates fingerprint:generate --platform ios | jq -r .hash)" >> "$GITHUB_OUTPUT"
      - id: base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --quiet "$BASE"
          pnpm install --frozen-lockfile
          echo "hash=$(pnpm -C apps/mobile exec expo-updates fingerprint:generate --platform ios | jq -r .hash)" >> "$GITHUB_OUTPUT"
      # On a fork the token cannot comment; continue-on-error keeps the pull request green.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_HASH: ${{ steps.base.outputs.hash }}
          HEAD_HASH: ${{ steps.head.outputs.hash }}
        run: |
          echo "Fingerprint $BASE_HASH (base) to $HEAD_HASH (head)"
          if [ "$BASE_HASH" != "$HEAD_HASH" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body \
              "Merging this changes the phone app's native fingerprint ($BASE_HASH to $HEAD_HASH), so it makes a new TestFlight build, not an over-the-air update."
          fi
