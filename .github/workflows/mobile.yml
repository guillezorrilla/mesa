# The phone app's release (ADR-0027): on a push to main that touches it, publish an over-the-air
# update when an EAS build with the same native fingerprint exists, else build one and send it to
# TestFlight. The only workflow that holds EXPO_TOKEN; it never runs for a pull request.
name: mobile

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/core/src/phone/protocol/**
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app bundles @mesa/core/phone from core's build.
      - run: pnpm --filter @mesa/core build
      - uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: expo/expo-github-action/continuous-deploy-fingerprint@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
        with:
          working-directory: apps/mobile
          platform: ios
          profile: production
          branch: production
          auto-submit-builds: true
