# The phone app's release (ADR-0027): on a push to main that touches it, publish an over-the-air
# update when a production build with the same native fingerprint exists, else build one on EAS
# and send it to TestFlight. The only workflow that holds EXPO_TOKEN; it never runs for a pull request.
name: mobile

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/core/src/phone/protocol/**
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-deploy
  cancel-in-progress: false

env:
  # Fetched at run time, never an app dependency: expo-doctor refuses eas-cli in the app (#1060).
  EAS: pnpm dlx eas-cli@27.7.2

jobs:
  deploy:
    # A dispatch from another branch would publish that branch to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The update bundles @mesa/core/phone from core's build.
      - run: pnpm --filter @mesa/core build
      - id: fingerprint
        run: echo "hash=$(pnpm exec expo-updates fingerprint:generate --platform ios | jq -r .hash)" >> "$GITHUB_OUTPUT"
      # A production build with this fingerprint, finished or still running (a build queued by an
      # earlier push takes the update once installed); an errored or canceled one does not count.
      - id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          HASH: ${{ steps.fingerprint.outputs.hash }}
        run: |
          count=$($EAS build:list --platform ios --build-profile production --fingerprint-hash "$HASH" --limit 50 --json --non-interactive \
            | jq '[.[] | select(.status != "ERRORED" and .status != "CANCELED")] | length')
          echo "Fingerprint $HASH: $count production build(s)"
          echo "exists=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish an update
        if: steps.build.outputs.exists == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: $EAS update --branch production --platform ios --environment production --message "$(git log -1 --format=%s)" --non-interactive
      # --no-wait: EAS schedules the TestFlight submission itself, so the runner does not sit out the build.
      - name: Build and submit to TestFlight
        if: steps.build.outputs.exists != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: $EAS build --platform ios --profile production --auto-submit --no-wait --non-interactive
