name: CI

# Manual only: this repo does not use paid Actions minutes. The merge gate is `pnpm verify`,
# which runs locally on pre-push (see scripts/verify.sh and .githooks/pre-push).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm build
