name: CI

# `verify` is the required check on main (scripts/github/protect.sh) and the first job of
# release.yml, so it has no path filters: every pull request runs it. It passes only when every
# stage of scripts/verify.sh, each a job here running in parallel, passes. ADR-0017.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm verify checks

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: command -v tmux || sudo apt-get install -y --no-install-recommends tmux
      - run: pnpm verify test --project unix --shard=${{ matrix.shard }}/3

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm verify mobile

  native:
    # The Rust crate depends on objc2 and the push extension on CryptoKit, so both build only on
    # macOS, as do vitest's `macos` project files (vitest.config.ts).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable on 2026-10-01
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - uses: ./.github/actions/setup
      - run: brew install tmux
      - run: pnpm verify test --project macos
      - run: pnpm verify native

  verify:
    needs: [checks, test, mobile, native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "stages: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
