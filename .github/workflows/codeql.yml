name: CodeQL

# Code scanning (ADR-0017). JavaScript/TypeScript and the workflows are analysed on every pull
# request and push to main. Swift (the push extension's package in apps/mobile/targets) takes a
# macOS runner, so it runs only when those files change, and weekly.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  swift-changed:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.files.outputs.changed }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename') ;;
            push) files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" -q '.files[].filename') ;;
            *) files=apps/mobile/targets/ ;;
          esac
          if printf '%s\n' "$files" | grep -q '^apps/mobile/targets/'; then
            echo changed=true >>"$GITHUB_OUTPUT"
          fi

  swift:
    name: Analyze (swift)
    needs: swift-changed
    if: needs.swift-changed.outputs.changed == 'true'
    runs-on: macos-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
      # The package is all the Swift there is to build (autobuild searched the repo for 14 min
      # before building the same thing).
      - run: swift build --package-path apps/mobile/targets/notifications
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
