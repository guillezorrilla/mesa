name: Release

# A v* tag (only the owner can push one) builds, signs, notarises and publishes Mesa with the
# same scripts a person runs by hand (scripts/release, docs/release.md, ADR-0017). To re-run one,
# dispatch this workflow from the tag itself, since the release environment deploys from v* tags
# only: gh workflow run release.yml --ref v0.1.0 -f tag=v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing v* tag to release
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: macos-latest
    # The owner approves each run; its secrets exist only here.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          # The build number is the commit count.
          fetch-depth: 0
      - name: The tag is this version
        run: test "$TAG" = "v$(sh scripts/release/version.sh)"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable on 2026-10-01
        with:
          toolchain: stable
      # build.sh runs the bundled mesa's x64 slice to check it.
      - name: Rosetta
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - run: pnpm install --frozen-lockfile
      - name: Build, sign and notarise
        run: pnpm release:build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/dist/Mesa_*_universal.dmg
            release/dist/Mesa.app.tar.gz
      - name: Publish
        run: pnpm release:publish
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Delete the signing keychain and the API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mesa-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/mesa-AuthKey.p8" "$RUNNER_TEMP/mesa-cert.p12"

  brew:
    needs: release
    # Stable releases only: a beta's tag has a hyphen.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: macos-latest
    environment: release
    steps:
      - name: Check the tap app's secrets
        env:
          HOMEBREW_APP_ID: ${{ secrets.HOMEBREW_APP_ID }}
          HOMEBREW_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
        run: |
          for name in HOMEBREW_APP_ID HOMEBREW_APP_PRIVATE_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is empty. Set it with: gh secret set $name --env release (docs/release.md)"
              exit 1
            fi
          done
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: guillezorrilla
          repositories: homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - run: sh scripts/release/brew.sh
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap.outputs.token }}
