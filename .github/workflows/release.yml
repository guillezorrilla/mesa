name: Release

# A v* tag (only the owner can push one) builds, signs, notarises and publishes Mesa with the
# same scripts a person runs by hand (scripts/release, docs/release.md, ADR-0017). To re-run one,
# dispatch this workflow from the tag itself, since the release environment deploys from v* tags
# only: gh workflow run release.yml --ref v0.1.0 -f tag=v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing v* tag to release
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # `pnpm release:publish` by hand pushes its tag too; that push finds the release already made
  # and builds nothing, so it never waits for approval or replaces the hand-built assets.
  published:
    runs-on: ubuntu-latest
    outputs:
      by-hand: ${{ steps.check.outputs.by-hand }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG was released by hand; nothing to build"
            echo by-hand=true >>"$GITHUB_OUTPUT"
          else
            echo by-hand=false >>"$GITHUB_OUTPUT"
          fi

  verify:
    needs: published
    if: needs.published.outputs.by-hand != 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: macos-latest
    # The owner approves each run; its secrets exist only here.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          # The build number is the commit count.
          fetch-depth: 0
      - name: The tag is this version
        run: test "$TAG" = "v$(sh scripts/release/version.sh)"
      # GitHub lets only the owner create a release on a protected v* tag, and Actions cannot
      # bypass a personal repo's ruleset, so publishing uses the owner's token (docs/release.md).
      - name: Check the publish token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is empty. Set it with: gh secret set RELEASE_TOKEN --env release (docs/release.md)"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable on 2026-10-01
        with:
          toolchain: stable
      # build.sh runs the bundled mesa's x64 slice to check it.
      - name: Rosetta
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - run: pnpm install --frozen-lockfile
      - name: Build, sign and notarise
        run: pnpm release:build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/dist/Mesa_*_universal.dmg
            release/dist/Mesa.app.tar.gz
      - name: Publish
        run: pnpm release:publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Delete the signing keychain and the API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mesa-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/mesa-AuthKey.p8" "$RUNNER_TEMP/mesa-cert.p12"
